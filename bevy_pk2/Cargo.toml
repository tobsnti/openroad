[package]
name = "bevy_pk2"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reader for SRO PK2 (JMXPACK) archives, exposed as a Bevy AssetReader."
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Reading an archive over HTTP byte ranges (src/pk2/source_http.rs). Off by
# default so a plain build of this crate pulls in no HTTP client at all.
#
# INERT ON wasm32, on purpose: `ureq`'s TLS path (`rustls` -> `ring`) has no
# `wasm32-unknown-unknown` build -- ring's build script compiles C through
# `clang --target=wasm32-unknown-unknown`, which needs a wasm-capable clang. So
# the HTTP source is cut out for that target instead of breaking the build; a
# `compile_error!` here would only restore the break. Switching the feature on
# for wasm32 therefore gets you *nothing*, not an HTTP source: a browser path
# reads ranges with `fetch`, which is asynchronous, and needs its own
# `Pk2Source`.
http-source = ["dep:ureq"]

[dependencies]
byteorder = { workspace = true }
bevy = { workspace = true }
bytes = { workspace = true }
encoding = {version = "0.2"}
futures = { workspace = true }
# Reading the user-supplied archive key out of their local config.yaml
# (see src/pk2/key.rs); already in the workspace tree via `client`.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# The HTTP client hangs off the targets that can build it; see the `http-source`
# note in [features] for why wasm32 is not one of them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only for the optional `http-source` feature (see `[features]`). `ureq 2` is
# already in this tree (launcher, tools), so the edge adds no new crate to
# Cargo.lock.
ureq = { version = "2", optional = true }
