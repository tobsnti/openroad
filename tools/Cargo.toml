[package]
name = "tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line tools for inspecting and converting SRO data formats."
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1"
lazy_static = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = "2"
ureq = { version = "2", features = ["json"] }
image = "0.24.5"
bevy = { workspace = true }
bytes = { workspace = true }
futures-lite = "2.5"
bevy_pk2 = { path = "../bevy_pk2" }
client = { path = "../client" }
# `sro_peer` and `protocol_verify` speak real packet types and reuse the client's
# net stack; `chrono`/`rand` are pinned to the same versions the client uses
# (client/Cargo.toml: chrono = "0.4", rand = "0.9"), so the dump line format and
# the handshake randomness cannot drift between the two.
packets = { path = "../packets" }
chrono = "0.4"
rand = "0.9"
byteorder = { workspace = true }
gltf-json = { version = "1.4", features = ["names", "extras"] }
fbxcel = { version = "0.9", features = ["writer", "tree"] }

[dev-dependencies]
gltf = "1.4"
