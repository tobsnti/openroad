# cargo-deny configuration — the supply-chain half of the merge gate.
#
# The dependency tree is permissive today; this exists to keep it that way, so a
# future `cargo add` of a copyleft or unlicensed crate fails the gate instead of
# quietly contaminating the tree. See CONTRIBUTING.md for the source-licence
# rules that govern code we write; this file governs code we pull in.
#
# Run with `make deny` (or `cargo deny check`). Install: `cargo install cargo-deny`.

[graph]
all-features = true

[licenses]
# Every licence below is present in, or acceptable for, the current tree.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    # Bundled fonts (see THIRD-PARTY.md); not code.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Weak, file-level copyleft, reaching only `launcher` via iced's svg feature
    # -> resvg/usvg. MPL-2.0 is GPL-compatible, and this tree is GPL throughout.
    "MPL-2.0",
    # Our own crates.
    "GPL-3.0-or-later",
]

# Deliberately NOT allowed, so adding one fails the gate: AGPL-3.0 (the project
# may reference skrillax/RSBot behaviour but never port their code), SSPL, CDDL,
# EPL, and any bare GPL-2.0-only / LGPL that is not offered under an alternative.

confidence-threshold = 0.9

[[licenses.exceptions]]
# Offered as `MIT OR Apache-2.0 OR LGPL-2.1-or-later`; we take MIT.
name = "r-efi"
allow = ["LGPL-2.1-or-later"]

[[licenses.exceptions]]
# Offered as `Apache-2.0 OR GPL-2.0-only`; we take Apache-2.0.
name = "self_cell"
allow = ["GPL-2.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"   # would have caught launcher's `icons = "0.X"`
# ... but a `path` dependency inside this workspace has no version to pin, so the
# rule above fires on our own crates, not on registry wildcards. Registry
# wildcards are still denied.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Unmaintained crates are judged by whether WE chose them. Measured 2026-10-27:
# 13 unmaintained advisories fire on this tree (ansi_term, atty, encoding,
# instant, paste, proc-macro-error, rustybuzz, ttf-parser x3, unsafe-libyaml,
# zbus_names, zvariant, zvariant_derive) and every single one says "No safe
# upgrade is available!" — they sit under bevy, iced and serde_yaml, not in any
# Cargo.toml of ours. Denying all of them would mean 13 dated ignore lines that
# rot, for a tree we cannot change. "workspace" still fails the gate the moment
# an unmaintained crate becomes a direct dependency, which is the decision this
# file exists to police. Vulnerabilities stay denied at every depth.
unmaintained = "workspace"
ignore = [
    # ruzstd 0.8.3, decompression bomb (DoS only, no corruption). It arrives
    # through bevy_image 0.20, which pins `^0.8`, so 0.9.1 is unreachable
    # without a bevy bump. Exposure here is the KTX2/zstd texture path on
    # assets the user supplies themselves, not on anything from the network.
    # REMOVE when bevy_image moves to ruzstd 0.9.
    "RUSTSEC-2026-0344",
    # encoding 0.2.33, last released 2016. This one IS ours: bevy_pk2 and the
    # client depend on it directly for CP949 (WINDOWS_949) and UTF-16 text.
    # encoding_rs is the replacement and the swap is four files
    # (bevy_pk2/src/pk2/entry.rs, client/src/assets/textdata/decode.rs,
    # client/src/util/buf_ext.rs) — a slice of its own, because DecoderTrap has
    # no one-to-one counterpart. REMOVE with that swap.
    "RUSTSEC-2021-0153",
    # proc-macro-error 1.0.4, a direct dependency of sro_macro_derive for
    # `abort!`. Measured 2026-10-27: the obvious escape, proc-macro-error2, is
    # itself unmaintained (RUSTSEC-2026-0173) — swapping would be churn, not a
    # fix. The real move is syn::Error, which changes the signatures of the
    # three derive builders that currently diverge via `abort!`. REMOVE with
    # that rewrite.
    "RUSTSEC-2024-0370",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The one git dependency in the tree, and it is temporary: bevy_tweening 0.16.0
# on crates.io still requires bevy ^0.19, while upstream `main` carries the
# finished 0.20 migration (djeedai/bevy_tweening#176). REMOVE THIS ENTRY
# together with the pin in client/Cargo.toml as soon as bevy_tweening 0.17 is
# published.
allow-git = ["https://github.com/djeedai/bevy_tweening"]
