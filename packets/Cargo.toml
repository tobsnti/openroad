[package]
name = "packets"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Silkroad Online network packet types and opcode wiring."
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Not the workspace's bevy: that one carries the client's features (render,
# windowing, audio). The packet types need the ECS, the app and logging only,
# and a server or tool that builds `packets` alone should not compile a
# renderer. In the client's build Cargo unifies the features, so nothing
# changes there.
bevy = { version = "0.20", default-features = false, features = ["bevy_log"] }
bytes = { workspace = true }
byteorder = { workspace = true }
thiserror = { workspace = true }
sro_macro = { path = "../sro_macro" }
sro_macro_derive = { path = "../sro_macro_derive" }