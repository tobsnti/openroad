# graphics.preset: high — the look the client shipped with before presets
# existed, for current discrete GPUs. Every key here is a default that
# config.yaml can override; see plugins/config/preset.rs.
graphics:
  view:
    view_distance: 5760.0
    fog_start: 3840.0
    fog_end: 5760.0
    cull_follows_envi_fog: false
    terrain_lod: "off"
    # other players, NPCs and monsters drawn this far (0 = all the server sends)
    character_distance: 0.0
  msaa: 4
  fxaa: true
  # bevy's own default, and the FXAA above is what it compensates
  sharpening: 0.6
  texture_detail: full
  anisotropy: 4
  bloom:
    enabled: true
  tonemapping: tony_mc_mapface
  water:
    quality: high
    # Soft shore and depth absorption. Both need `depth_prepass`, which is
    # false here today, so they are inert until that switch is measured
    # (GFX-MODERN-RANGLISTE.md 3.2) - set, not guessed, when it flips.
    shore_fade: 24.0
    absorption: 1.0
  objects:
    factor: 150.0
    min_distance: 1200.0
    nature_view_distance: 0.0
    nature_density: 1.0
    # swaying trees, flags and lamps (Dynamic Animation)
    animate: true
  render_scale: 1.0
  streaming:
    residency_grace_secs: 30.0
    region_builds_per_frame: 2
    region_unloads_per_frame: 2
    object_spawns_per_frame: 64
    resource_spawns_per_frame: 16
  depth_prepass: false
  # Alpha-to-coverage is built and switchable, but it ships OFF — and the
  # reason is a trade, not a regression. Corrected 2026-10-23 after a paired
  # in-process measurement (dev switch, noise floor exactly 0): A2C **smooths**
  # the edges (edge measure falls in all three bands: crown 23.676 vs 24.326,
  # bush 18.986 vs 20.593, near grass 20.622 vs 21.518). The earlier claim that
  # it raises the edge measure came from comparing two separate *processes*,
  # whose pose, particle and swing differences exceed the effect by an order of
  # magnitude. What A2C really costs is foliage **density**: the sky share
  # through a crown rises at every distance (+1.60 to +3.76 pp). So it is a
  # calmer edge against systematically thinner leaves — and the original tests
  # hard (ref 0x80), which makes "off" the closer behaviour too.
  # If it is ever turned back on, the measured limit is ~400 units: the ratio
  # of smoothing per point of thinning is best near (-0.32 at 196, -0.22 at
  # 376) and falls off behind that (-0.08 at 576).
  # The coupling in graphics.rs is NOT optional: with the depth prepass on as
  # well, the crown's sky share jumps 40.65 % -> 69.85 % and the foliage
  # disintegrates — measured, same tree, frozen time.
  foliage_alpha_to_coverage: false
  shadows:
    enabled: true
    cascades: 2
    map_size: 2048
  # particle caps (Effect Quality) and the sun's lens flare
  effect_quality: high
  # armed, but dormant until depth_prepass is on (ultra-only today)
  effect_soft_fade: 10.0
  lens_flare: true
  dungeon:
    max_lights: 16
  # Both side projections on steep ground, cross-faded by the normal.
  terrain:
    slope_sampling: full
