# graphics.preset: medium — integrated GPUs and older discrete cards. Every key
# here is a default that config.yaml can override; see plugins/config/preset.rs.
graphics:
  view:
    view_distance: 3840.0
    fog_start: 2880.0
    fog_end: 3840.0
    cull_follows_envi_fog: true
    terrain_lod: normal
    # other players, NPCs and monsters drawn this far (0 = all the server sends)
    character_distance: 2500.0
  msaa: 1
  fxaa: true
  texture_detail: full
  anisotropy: 4
  bloom:
    enabled: false
  tonemapping: none
  water:
    quality: low
  objects:
    factor: 150.0
    min_distance: 1200.0
    nature_view_distance: 2000.0
    nature_density: 1.0
    # swaying trees, flags and lamps (Dynamic Animation)
    animate: true
  render_scale: 1.0
  streaming:
    residency_grace_secs: 30.0
    region_builds_per_frame: 2
    region_unloads_per_frame: 2
    object_spawns_per_frame: 64
    resource_spawns_per_frame: 16
  depth_prepass: false
  shadows:
    enabled: true
    cascades: 1
    map_size: 1024
  # particle caps (Effect Quality) and the sun's lens flare
  effect_quality: medium
  lens_flare: false
  dungeon:
    max_lights: 16
